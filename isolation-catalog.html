<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Isolation Catalog</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      line-height: 1.5;
      color: #333;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #eaeaea;
    }
    
    .header h1 {
      margin: 0;
      color: #333;
      font-size: 1.8rem;
    }
    
    .meta-info {
      background: #f8f9fa;
      padding: 10px 15px;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .refresh-button {
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    
    .refresh-button:hover {
      background: #0060df;
    }
    
    .back-link {
      padding: 5px 10px;
      color: #0070f3;
      text-decoration: none;
      border-radius: 4px;
      margin-right: 10px;
      background-color: rgba(0, 112, 243, 0.05);
    }
    
    .back-link:hover {
      background-color: rgba(0, 112, 243, 0.1);
    }
    
    .components-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    
    .component-card {
      border: 1px solid #eaeaea;
      border-radius: 8px;
      padding: 20px;
      transition: all 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    
    .component-card:hover {
      border-color: #0070f3;
      transform: translateY(-2px);
      box-shadow: 0 5px 10px rgba(0,0,0,0.05);
    }
    
    .component-card h2 {
      margin-top: 0;
      color: #0070f3;
      font-size: 1.4rem;
    }
    
    .component-card p {
      color: #666;
      margin-bottom: 0;
    }
    
    .component-card .component-type {
      display: inline-block;
      padding: 3px 6px;
      background: #f0f0f0;
      border-radius: 3px;
      font-size: 0.75rem;
      margin-top: 8px;
    }
    
    .loading {
      text-align: center;
      padding: 50px;
      color: #666;
    }
    
    .error-message {
      background-color: #fff0f0;
      color: #d32f2f;
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Component Isolation Catalog</h1>
    <div>
      <a href="/" class="back-link">Back to Main App</a>
    </div>
  </div>
  
  <div class="meta-info" id="meta-info">
    <span>Loading catalog information...</span>
    <button class="refresh-button" onclick="loadComponents(true)">Refresh Components</button>
  </div>
  
  <p>Select a component to view its isolated rendering and examples:</p>
  
  <div id="components-container">
    <div class="loading">Loading components...</div>
  </div>
  
  <script>
    // Define a direct button component for demonstration as a fallback
    const fallbackButton = {
      name: 'Button',
      displayName: 'Button',
      htmlPath: '/src/components/Button/button.isolation.vite.html',
      type: 'html'
    };

    // Function to format date
    function formatDate(dateString) {
      try {
        const date = new Date(dateString);
        return date.toLocaleString();
      } catch (e) {
        return dateString || 'Unknown date';
      }
    }
    
    // Function to load and display components
    async function loadComponents(forceRefresh = false) {
      const componentsContainer = document.getElementById('components-container');
      const metaInfo = document.getElementById('meta-info');
      
      try {
        // Simple approach: fetch the JSON file directly with cache busting if needed
        const cacheBuster = forceRefresh ? `?t=${Date.now()}` : '';
        
        // First try to fetch with a timeout
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 second timeout
        
        try {
          const response = await fetch(`/component-catalog.json${cacheBuster}`, {
            signal: controller.signal,
            headers: {
              'Accept': 'application/json',
              'Cache-Control': 'no-cache'
            }
          });
          
          clearTimeout(timeoutId);
          
          if (!response.ok) {
            throw new Error(`Failed to load components (Status: ${response.status})`);
          }
          
          const contentType = response.headers.get('content-type');
          if (!contentType || !contentType.includes('application/json')) {
            throw new Error(`Expected JSON but got ${contentType}`);
          }
          
          const textContent = await response.text();
          
          // Check if the response is valid JSON
          let catalog;
          try {
            catalog = JSON.parse(textContent);
          } catch (e) {
            console.error('Invalid JSON received:', textContent.substring(0, 100) + '...');
            throw new Error('Invalid JSON response from server');
          }
          
          const components = catalog.components || [];
          
          // Update the meta information
          metaInfo.innerHTML = `
            <span>
              Found ${components.length} component(s) | 
              Last updated: ${formatDate(catalog.generatedAt)}
            </span>
            <button class="refresh-button" onclick="loadComponents(true)">Refresh Components</button>
          `;
          
          // If no components found, show the default Button component
          if (!components || components.length === 0) {
            componentsContainer.innerHTML = `
              <p>No isolation components found.</p>
              <div class="components-grid">
                <a href="${fallbackButton.htmlPath}" class="component-card">
                  <h2>${fallbackButton.displayName}</h2>
                  <p>View the ${fallbackButton.displayName} component in isolation</p>
                  <span class="component-type">${fallbackButton.type}</span>
                </a>
              </div>
            `;
            return;
          }
          
          // Create the grid of component cards
          const grid = document.createElement('div');
          grid.className = 'components-grid';
          
          // For each component, create a card
          components.forEach(component => {
            const card = document.createElement('a');
            card.className = 'component-card';
            
            // Determine the component link
            const componentPath = component.htmlPath || 
                                `/src/components/${component.name}/${component.name.toLowerCase()}.isolation.vite.html`;
            card.href = componentPath;
            
            const title = document.createElement('h2');
            title.textContent = component.displayName || component.name;
            
            const description = document.createElement('p');
            description.textContent = component.description || `View the ${component.displayName || component.name} component in isolation`;
            
            const typeTag = document.createElement('span');
            typeTag.className = 'component-type';
            typeTag.textContent = component.type === 'html' ? 'HTML' : (component.type || 'Component');
            
            card.appendChild(title);
            card.appendChild(description);
            card.appendChild(typeTag);
            grid.appendChild(card);
          });
          
          // Replace the loading indicator with our grid
          componentsContainer.innerHTML = '';
          componentsContainer.appendChild(grid);
          
        } catch (fetchError) {
          clearTimeout(timeoutId);
          
          // Create a default component grid with the button
          componentsContainer.innerHTML = `
            <div class="error-message">
              <p>Error loading component catalog: ${fetchError.message}</p>
              <p>Using default component instead.</p>
            </div>
            
            <div class="components-grid">
              <a href="${fallbackButton.htmlPath}" class="component-card">
                <h2>${fallbackButton.displayName}</h2>
                <p>View the ${fallbackButton.displayName} component in isolation</p>
                <span class="component-type">${fallbackButton.type}</span>
              </a>
            </div>
          `;
          
          console.error('Error loading components:', fetchError);
        }
        
      } catch (error) {
        console.error('Critical error:', error);
        
        // Show error message with fallback component
        componentsContainer.innerHTML = `
          <div class="error-message">
            <p>Error loading components: ${error.message}</p>
          </div>
          
          <div class="components-grid">
            <a href="${fallbackButton.htmlPath}" class="component-card">
              <h2>${fallbackButton.displayName}</h2>
              <p>View the ${fallbackButton.displayName} component in isolation</p>
              <span class="component-type">${fallbackButton.type}</span>
            </a>
          </div>
        `;
      }
    }
    
    // Load the components when the page is ready
    document.addEventListener('DOMContentLoaded', loadComponents);
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      loadComponents();
    }
  </script>
</body>
</html>
